name: Verify public ONES VPN source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.13'
      - name: Download and verify public native module
        run: bash scripts/fetch-libbox.sh
      - name: Python provenance, Kotlin tests and Android build
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
